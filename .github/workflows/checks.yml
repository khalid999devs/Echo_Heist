name: Foundation checks and native builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            target: headless-checks
          - os: windows-2022
            architecture: x64
            target: windows-x64
          - os: macos-14
            architecture: arm64
            target: macos-arm64
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Verify interpreter architecture
        run: >-
          python -c "import platform;
          actual = platform.machine().lower();
          expected = '${{ matrix.architecture }}';
          assert actual in ({'arm64', 'aarch64'} if expected == 'arm64' else {'amd64', 'x86_64'}), actual;
          print(platform.python_version(), actual)"
      - name: Install locked development tools
        run: |
          python -m pip install uv==0.12.22
          uv sync --locked --all-extras --python python
      - name: Run foundation checks
        run: uv run --locked --all-extras python scripts/checks/run.py
      - name: Build native primary artifact
        if: matrix.target != 'headless-checks'
        run: uv run --locked --all-extras python scripts/packaging/build.py
      - name: Exercise Windows frozen app with SDL dummy video
        if: matrix.target == 'windows-x64'
        run: >-
          uv run --locked --all-extras python scripts/packaging/smoke.py
          dist/EchoHeist/EchoHeist.exe --mute --dummy-video
      - name: Exercise macOS frozen app with SDL dummy video
        if: matrix.target == 'macos-arm64'
        run: >-
          uv run --locked --all-extras python scripts/packaging/smoke.py
          "dist/Echo Heist.app" --mute --dummy-video
      - name: Save native build and smoke evidence
        if: matrix.target != 'headless-checks'
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.manifest.json
            output/native-smoke/*.json
            output/native-smoke/desktop.png
